<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141915"/>
      <stop offset="100%" stop-color="#0d110e"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5cc70"/>
      <stop offset="100%" stop-color="#c99732"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)"/>

  <!-- Outer Traditional Wooden Frame -->
  <rect x="40" y="40" width="432" height="432" rx="36" fill="#1b221d" stroke="#36443a" stroke-width="8" filter="url(#shadow)"/>

  <!-- Inner Tatami Grid Floor -->
  <rect x="64" y="64" width="384" height="384" rx="20" fill="#202922" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Tatami Mat Room Partitions -->
  <!-- Top Left Room 2x1 -->
  <rect x="80" y="80" width="210" height="100" rx="10" fill="rgba(120, 184, 133, 0.35)" stroke="#78b885" stroke-width="6"/>
  <!-- Clue 4 in Top Left Room -->
  <circle cx="185" cy="130" r="28" fill="#1b231d" stroke="url(#gold-grad)" stroke-width="4"/>
  <text x="185" y="139" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#f0ebe1" text-anchor="middle">4</text>

  <!-- Top Right Room 1x2 -->
  <rect x="306" y="80" width="126" height="210" rx="10" fill="rgba(97, 175, 239, 0.35)" stroke="#61afef" stroke-width="6"/>
  <!-- Clue 3 in Top Right Room -->
  <circle cx="369" cy="185" r="28" fill="#1b231d" stroke="url(#gold-grad)" stroke-width="4"/>
  <text x="369" y="194" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#f0ebe1" text-anchor="middle">3</text>

  <!-- Bottom Left Room 1x2 -->
  <rect x="80" y="196" width="100" height="236" rx="10" fill="rgba(226, 176, 83, 0.35)" stroke="#e2b053" stroke-width="6"/>
  <!-- Clue 2 in Bottom Left Room -->
  <circle cx="130" cy="314" r="28" fill="#1b231d" stroke="url(#gold-grad)" stroke-width="4"/>
  <text x="130" y="323" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#f0ebe1" text-anchor="middle">2</text>

  <!-- Bottom Right Master Chamber 2x2 -->
  <rect x="196" y="306" width="236" height="126" rx="10" fill="rgba(171, 129, 214, 0.35)" stroke="#ab81d6" stroke-width="6"/>
  <!-- Clue 6 in Bottom Right Room -->
  <circle cx="314" cy="369" r="28" fill="#1b231d" stroke="url(#gold-grad)" stroke-width="4"/>
  <text x="314" y="378" font-family="-apple-system, sans-serif" font-size="28" font-weight="900" fill="#f0ebe1" text-anchor="middle">6</text>

  <!-- Center Japanese Kanji Seal "Shikaku" (四角) -->
  <rect x="196" y="196" width="94" height="94" rx="16" fill="#8f2d34" stroke="#e06c75" stroke-width="3"/>
  <text x="243" y="258" font-family="serif, 'Hiragino Mincho ProN'" font-size="52" font-weight="bold" fill="#fbf0d9" text-anchor="middle">四</text>
</svg>
